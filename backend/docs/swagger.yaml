        description: Clear sets these metadata fields to null
        example:
        - film_speed
        items:
          type: string
        type: array
      colors:
        items:
          $ref: '#/definitions/analogdb.Color'
        type: array
      description:
        example: New description
        type: string
      film_make:
        example: kodak
        type: string
      film_speed:
        example: 200
        type: integer
      film_type:
        example: gold 200
        type: string
      focal_length:
        example: 50
        type: integer
      grayscale:
        example: false
        type: boolean
      keywords:
        items:
          $ref: '#/definitions/analogdb.Keyword'
        type: array
      nsfw:
        example: true
        type: boolean
      score:
        example: 1010
        type: integer
      sprocket:
        example: true
        type: boolean
    type: object
  analogdb.Post:
    properties:
      aperture:
        example: f/2.0
        type: string
      author:
        example: thecameraman
        type: string
      camera_make:
        example: nikon
        type: string
      camera_model:
        example: fm2
        type: string
      caption:
        example: A woman on a beach at sunset
        type: string
      colors:
        items:
          $ref: '#/definitions/analogdb.Color'
        type: array
      created:
        description: time the post was added to analogdb
        example: "2025-07-11T12:00:00Z"
        type: string
      description:
        example: My favorite camera and film combo on 35mm at f/2.0
        type: string
      film_make:
        example: kodak
        type: string
      film_speed:
        example: 400
        type: integer
      film_type:
        example: color
        type: string
      focal_length:
        example: 35
        type: integer
      grayscale:
        example: false
        type: boolean
      id:
        example: 1
        type: integer
      images:
        items:
          $ref: '#/definitions/analogdb.Image'
        type: array
      keywords:
        items:
          $ref: '#/definitions/analogdb.Keyword'
        type: array
      nsfw:
        example: false
        type: boolean
      permalink:
        example: https://www.reddit.com/r/analog/comments/1/post
        type: string
      score:
        example: 1000
        type: integer
      sprocket:
        example: false
        type: boolean
      timestamp:
        example: 1752354541
        type: integer
      title:
        example: A day at the fields [Nikon FM2 | Portra 400]
        type: string
      updated:
        description: time the post was last changed in analogdb
        example: "2025-07-11T12:00:00Z"
        type: string
    type: object
  analogdb.PostCaption:
    properties:
      caption:
        example: A woman on a beach at sunset
        type: string
      model:
        example: google/gemini-2.5-flash-lite
        type: string
      raw:
        type: object
      version:
        example: v1
        type: string
    type: object
  analogdb.PostExtraction:
    properties:
      created:
        type: string
      extractor_version:
        example: 2026-10-a
        type: string
      input:
        example: 'title: Dusk [Nikon FM, Portra 400]'
        type: string
      input_hash:
        example: 9f2c...
        type: string
      model:
        example: google/gemini-2.5-flash-lite
        type: string
      post_id:
        example: 1234
        type: integer
      raw:
        type: object
      unmatched:
        items:
          type: object
        type: array
      updated:
        type: string
    type: object
  server.CamerasResponse:
    properties:
      cameras:
        items:
          $ref: '#/definitions/analogdb.Camera'
        type: array
    type: object
  server.CaptionsMissingResponse:
    properties:
      ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    type: object
  server.CreateCameraResponse:
    properties:
      camera:
        $ref: '#/definitions/analogdb.CreateCamera'
      message:
        example: Success, camera created
        type: string
    type: object
  server.CreateFilmResponse:
    properties:
      film:
        $ref: '#/definitions/analogdb.CreateFilm'
      message:
        example: Success, film created
        type: string
    type: object
  server.CreatePostResponse:
    properties:
      message:
        example: Success, post created
        type: string
      post:
        $ref: '#/definitions/analogdb.Post'
    type: object
  server.DeleteResponse:
    properties:
      message:
        example: Success, post deleted
        type: string
    type: object
  server.ExtractionsRequest:
    properties:
      extractions:
        items:
          $ref: '#/definitions/analogdb.PostExtraction'
        type: array
    type: object
  server.ExtractionsResponse:
    properties:
      extractions:
        items:
          $ref: '#/definitions/analogdb.PostExtraction'
        type: array
      next_before_id:
        example: 1200
        type: integer
    type: object
  server.FilmsResponse:
    properties:
      films:
        items:
          $ref: '#/definitions/analogdb.Film'
        type: array
    type: object
  server.IDsResponse:
    properties:
      ids:
        example:
        - 1
        - 2
        - 3
        - 4
        - 5
        items:
          type: integer
        type: array
    type: object
  server.KeywordsResponse:
    properties:
      keywords:
        items:
          $ref: '#/definitions/analogdb.KeywordSummary'
        type: array
    type: object
  server.Meta:
    properties:
      next_cursor:
        description: Opaque cursor for the next page, empty at the end
        example: eyJzIjoidGltZSIsInYiOjE3NTIyNDQxMTYsImlkIjo0MDIxMX0
        type: string
      next_page_id:
        description: 'Deprecated: use next_cursor'
        example: 1752244116
        type: integer
      next_page_url:
        example: /posts?cursor=eyJzIjoidGltZSIsInYiOjE3NTIyNDQxMTYsImlkIjo0MDIxMX0&page_size=20&sort=time
        type: string
      page_size:
        example: 20
        type: integer
      seed:
        example: 37
        type: integer
      total_posts:
        example: 200
        type: integer
    type: object
  server.PatchResponse:
    properties:
      message:
        example: Success, post patched
        type: string
    type: object
  server.PostResponse:
    properties:
      meta:
        $ref: '#/definitions/server.Meta'
      posts:
        items:
          $ref: '#/definitions/analogdb.Post'
        type: array
    type: object
  server.SearchMeta:
    properties:
      next_cursor:
        description: Opaque cursor for the next page, empty at the end
        example: eyJvIjo1MH0
        type: string
      next_page_url:
        example: /search?cursor=eyJvIjo1MH0&page_size=50&q=girl+at+sunset
        type: string
      page_size:
        example: 50
        type: integer
    type: object
  server.SearchResponse:
    properties:
      meta:
        $ref: '#/definitions/server.SearchMeta'
      posts:
        items:
          $ref: '#/definitions/analogdb.Post'
        type: array
      related_keywords:
        example:
        - beach
        - silhouette
        - dusk
        items:
          type: string
        type: array
    type: object
  server.SimilarPostsResponse:
    properties:
      posts:
        items:
          $ref: '#/definitions/analogdb.Post'
        type: array
    type: object
  server.UpsertExtractionsResponse:
    properties:
      skipped:
        example:
        - 1234
        items:
          type: integer
        type: array
      written:
        example: 499
        type: integer
    type: object
  server.VectorsMissingResponse:
    properties:
      extra:
        example: 0
        type: integer
      ids:
        example:
        - 1
        - 2
        - 3
        items:
          type: integer
        type: array
    type: object
  server.encodePostsRequest:
    properties:
      batch_size:
        example: 20
        type: integer
      ids:
        items:
          type: integer
        type: array
    type: object
  server.encodePostsResponse:
    properties:
      failed_ids:
        items:
          type: integer
        type: array
      message:
        example: successfully encoded 5 posts
        type: string
    type: object
host: api.analogdb.com
info:
  contact: {}
  description: API for analogdb film database
  title: AnalogDB API
  version: "1.0"
paths:
  /admin/extractions:
    get:
      description: List stored metadata extractions, newest post first (requires authentication)
      parameters:
      - description: Only extractions with or without unmatched mentions
        in: query
        name: has_unmatched
        type: boolean
      - description: Only extractions with an unmatched mention of this kind
        enum:
        - camera
        - film
        in: query
        name: kind
        type: string
      - description: Only extractions with an unmatched mention with this normalized
          key
        in: query
        name: key
        type: string
      - description: Include the input text and raw LLM output
        in: query
        name: full
        type: boolean
      - description: Only post ids below this, for paging
        in: query
        name: before_id
        type: integer
      - default: 100
        description: Number of results, at most 500
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.ExtractionsResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: List post metadata extractions
      tags:
      - extractions
    post:
      consumes:
      - application/json
      description: Create or replace the stored metadata extraction of each post (requires
        authentication). Posts that don't exist are skipped.
      parameters:
      - description: extractions to store, at most 500
        in: body
        name: extractions
        required: true
        schema:
          $ref: '#/definitions/server.ExtractionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.UpsertExtractionsResponse'
        "400":
          description: Invalid extractions
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Store post metadata extractions
      tags:
      - extractions
  /camera:
    post:
      consumes:
      - application/json
      description: Create a new camera entry (requires authentication)
      parameters:
      - description: camera data to create
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateCamera'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateCameraResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new camera
      tags:
      - camera
    put:
      consumes:
      - application/json
      description: Create a new camera entry (requires authentication)
      parameters:
      - description: camera data to create
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateCamera'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateCameraResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new camera
      tags:
      - camera
  /cameras:
    get:
      consumes:
      - application/json
      description: Retrieve cameras with optional query parameters for filtering and
        sorting
      parameters:
      - description: Sort order
        enum:
        - alphabetical
        - counts
        in: query
        name: sort
        type: string
      - description: Number of results to return
        in: query
        name: page_size
        type: integer
      - description: Filter by camera make
        in: query
        name: make
        type: string
      - description: Filter by camera model
        in: query
        name: model
        type: string
      - description: Filter by specific camera ID
        in: query
        name: id
        type: integer
      - description: Include count data
        in: query
        name: include_counts
        type: boolean
      - description: Exclude zero counts
        in: query
        name: exclude_zero_counts
        type: boolean
      - description: Only return entries with at least this many posts, implies include_counts
        in: query
        name: min_count
        type: integer
      - description: Attach this many top scoring posts to each entry (1 to 10)
        in: query
        name: top_posts
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.CamerasResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get cameras with optional filtering
      tags:
      - cameras
  /encode:
    put:
      consumes:
      - application/json
      description: Encode posts to generate embeddings for similarity search. Supports
        both single post and batch encoding (requires authentication)
      parameters:
      - description: Post IDs and batch size for encoding
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.encodePostsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.encodePostsResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Encode posts for similarity matching
      tags:
      - similarity
  /film:
    post:
      consumes:
      - application/json
      description: Create a new film entry (requires authentication)
      parameters:
      - description: Film data to create
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateFilm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateFilmResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new film
      tags:
      - film
    put:
      consumes:
      - application/json
      description: Create a new film entry (requires authentication)
      parameters:
      - description: Film data to create
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateFilm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateFilmResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new film
      tags:
      - film
  /films:
    get:
      consumes:
      - application/json
      description: Retrieve films with optional query parameters for filtering and
        sorting
      parameters:
      - description: Sort order
        enum:
        - alphabetical
        - counts
        in: query
        name: sort
        type: string
      - description: Number of results to return
        in: query
        name: page_size
        type: integer
      - description: Filter by film make
        in: query
        name: make
        type: string
      - description: Filter by film type
        in: query
        name: type
        type: string
      - description: Filter by film speed
        in: query
        name: speed
        type: integer
      - description: Filter by color type
        in: query
        name: colortype
        type: string
      - description: Filter by specific film ID
        in: query
        name: id
        type: integer
      - description: Include count data
        in: query
        name: include_counts
        type: boolean
      - description: Exclude zero counts
        in: query
        name: exclude_zero_counts
        type: boolean
      - description: Only return entries with at least this many posts, implies include_counts
        in: query
        name: min_count
        type: integer
      - description: Attach this many top scoring posts to each entry (1 to 10)
        in: query
        name: top_posts
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.FilmsResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get films with optional filtering
      tags:
      - films
  /ids:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all post IDs in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.IDsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get all post IDs
      tags:
      - posts
  /keywords/summary:
    get:
      description: Most common keywords with their post counts, optionally only from
        posts created in the last days
      parameters:
      - default: 50
        description: Number of keywords to return
        in: query
        name: page_size
        type: integer
      - description: Only count keywords of posts created in the last days, 1 to 90
        in: query
        name: days
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.KeywordsResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get keyword summary
      tags:
      - keywords
  /post:
    post:
      consumes:
      - application/json
      description: Create a new post with image analysis and similarity encoding (requires
        authentication)
      parameters:
      - description: Post data to create
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreatePost'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreatePostResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "409":
          description: Post with permalink already exists
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new post
      tags:
      - post
  /post/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a post by ID from database (requires authentication)
      parameters:
      - description: Post ID to delete
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.DeleteResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Delete a post
      tags:
      - post
    get:
      consumes:
      - application/json
      description: Get a post by ID from database
      parameters:
      - description: Post ID to get
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analogdb.Post'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Get a post
      tags:
      - post
    patch:
      consumes:
      - application/json
      description: Partially update a post's properties by ID (requires authentication)
      parameters:
      - description: Post ID to update
        in: path
        name: id
        required: true
        type: integer
      - description: Post fields to update
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/analogdb.PatchPost'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.PatchResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Update a post
      tags:
      - post
  /post/{id}/similar:
    get:
      consumes:
      - application/json
      description: Find posts similar to a given post using similarity matching
      parameters:
      - description: Post ID to find similar posts for
        in: path
        name: id
        required: true
        type: integer
      - default: 12
        description: Maximum number of similar posts to return
        in: query
        name: page_size
        type: integer
      - description: Include nsfw posts in query
        in: query
        name: nsfw
        type: boolean
      - description: Include b&w posts in query
        in: query
        name: grayscale
        type: boolean
      - description: Include sprocketshot posts in query
        in: query
        name: sprocket
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SimilarPostsResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Find similar posts
      tags:
      - post
  /posts:
    get:
      consumes:
      - application/json
      description: Retrieve posts with optional query parameters for filtering by
        camera, film, keywords, etc. Supports pagination
      parameters:
      - default: 20
        description: Number of posts per page
        in: query
        name: page_size
        type: integer
      - description: Opaque cursor from next_cursor for the next page
        in: query
        name: cursor
        type: string
      - description: 'Deprecated: use cursor. Keyset from next_page_id, not supported
          with sort=random'
        in: query
        name: page_id
        type: integer
      - default: time
        description: Sort order
        enum:
        - time
        - score
        - random
        in: query
        name: sort
        type: string
      - description: Random seed for consistent random sorting, picked from 1..500
          when missing
        in: query
        name: seed
        type: integer
      - description: Filter by post ID
        in: query
        name: id
        type: integer
      - description: Filter by post title
        in: query
        name: title
        type: string
      - description: Filter by author
        in: query
        name: author
        type: string
      - description: Filter by start time (unix timestamp)
        in: query
        name: time_start
        type: integer
      - description: Filter by end time (unix timestamp)
        in: query
        name: time_end
        type: integer
      - description: Filter by camera make
        in: query
        name: camera_make
        type: string
      - description: Filter by camera model
        in: query
        name: camera_model
        type: string
      - description: Filter by film make
        in: query
        name: film_make
        type: string
      - description: Filter by film type
        in: query
        name: film_type
        type: string
      - description: Filter by film speed
        in: query
        name: film_speed
        type: integer
      - description: Filter by focal length
        in: query
        name: focal_length
        type: integer
      - description: Filter by aperture
        in: query
        name: aperture
        type: string
      - description: Filter by NSFW (true=only, false=exclude)
        in: query
        name: nsfw
        type: boolean
      - description: Filter by black and white (true=only, false=exclude)
        in: query
        name: grayscale
        type: boolean
      - description: Filter by sprocketshots (true=only, false=exclude)
        in: query
        name: sprocket
        type: boolean
      - collectionFormat: multi
        description: Filter by keywords (multiple allowed)
        in: query
        items:
          type: string
        name: keyword
        type: array
      - collectionFormat: multi
        description: Color filter (multiple allowed)
        in: query
        items:
          type: string
        name: color
        type: array
      - collectionFormat: multi
        description: Minimum color percentage (multiple allowed)
        in: query
        items:
          type: number
        name: min_color
        type: array
      - description: Minimum picture width
        in: query
        name: width_min
        type: number
      - description: Maximum picture width
        in: query
        name: width_max
        type: number
      - description: Minimum picture height
        in: query
        name: height_min
        type: number
      - description: Maximum picture height
        in: query
        name: height_max
        type: number
      - description: Minimum picture aspect ratio
        in: query
        name: ratio_min
        type: number
      - description: Maximum picture aspect ratio
        in: query
        name: ratio_max
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.PostResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get posts with optional filtering and pagination
      tags:
      - posts
  /scrape/captions/missing:
    get:
      description: List ids of posts with no caption, or with a caption of another
        version when version is set (requires authentication)
      parameters:
      - description: Caption version the posts should have
        in: query
        name: version
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.CaptionsMissingResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: List posts missing a caption
      tags:
      - scrape
  /scrape/vectors/missing:
    get:
      description: List ids of posts with no object in the vector database, oldest
        first, and how many objects belong to deleted posts (requires authentication)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.VectorsMissingResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
        "503":
          description: Vector database unavailable
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: List posts missing a vector
      tags:
      - scrape
  /search:
    get:
      description: Hybrid search over image vectors, tags, captions and titles. Related
        keywords are returned on the first page only
      parameters:
      - description: Search text, 1 to 200 characters
        in: query
        name: q
        required: true
        type: string
      - default: 50
        description: Number of posts per page
        in: query
        name: page_size
        type: integer
      - description: Opaque cursor from next_cursor for the next page
        in: query
        name: cursor
        type: string
      - description: Filter by NSFW (true=only, false=exclude)
        in: query
        name: nsfw
        type: boolean
      - description: Filter by black and white (true=only, false=exclude)
        in: query
        name: grayscale
        type: boolean
      - description: Filter by sprocketshots (true=only, false=exclude)
        in: query
        name: sprocket
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SearchResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Search posts by text
      tags:
      - search
  /search/image:
    post:
      consumes:
      - multipart/form-data
      description: Find posts that look like an uploaded JPEG, PNG or WebP image of
        at most 5 MB. Returns one page
      parameters:
      - description: Image to search with
        in: formData
        name: image
        required: true
        type: file
      - default: 50
        description: Number of posts to return
        in: query
        name: page_size
        type: integer
      - description: Filter by NSFW (true=only, false=exclude)
        in: query
        name: nsfw
        type: boolean
      - description: Filter by black and white (true=only, false=exclude)
        in: query
        name: grayscale
        type: boolean
      - description: Filter by sprocketshots (true=only, false=exclude)
        in: query
        name: sprocket
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SearchResponse'
        "400":
          description: Invalid request
          schema:
            $ref: '#/definitions/analogdb.Error'
        "413":
          description: Image too large
          schema:
            $ref: '#/definitions/analogdb.Error'
        "415":
          description: Unsupported image type
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
        "503":
          description: Too many image searches
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Search posts by image
      tags:
      - search
securityDefinitions:
  BasicAuth:
    type: basic
swagger: "2.0"
