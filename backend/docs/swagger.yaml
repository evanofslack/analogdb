  analogdb.PatchPost:
    properties:
      aperture:
        example: f/2.4
        type: string
      camera_make:
        example: canon
        type: string
      camera_model:
        example: ae-1
        type: string
      caption:
        $ref: '#/definitions/analogdb.PostCaption'
