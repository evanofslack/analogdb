basePath: /v1
definitions:
  analogdb.Camera:
    properties:
      created:
        example: "2025-07-11T12:00:00Z"
        type: string
      description:
        example: Nikon FM2 is a dependable SLR camera
        type: string
      id:
        example: 1
        type: integer
      make:
        example: nikon
        type: string
      model:
        example: fm2
        type: string
      post_count:
        example: 50
        type: integer
      slug:
        example: nikon-fm2
        type: string
      top_posts:
        items:
          $ref: '#/definitions/analogdb.CatalogPost'
        type: array
      updated:
        example: "2025-07-11T12:00:00Z"
        type: string
    type: object
  analogdb.CatalogPost:
    properties:
      id:
        example: 1
        type: integer
      images:
        items:
          $ref: '#/definitions/analogdb.Image'
        type: array
      score:
        example: 150
        type: integer
      title:
        example: Sunset over the lake
        type: string
    type: object
  analogdb.Color:
    properties:
      css:
        example: dimgray
        type: string
      hex:
        example: '#837d5c'
        type: string
      html:
        example: gray
        type: string
      percent:
        example: 0.55
        type: number
    type: object
  analogdb.CreateCamera:
    properties:
      description:
        example: Nikon FM2 is a dependable SLR camera
        type: string
      make:
        example: nikon
        type: string
      model:
        example: fm2
        type: string
    type: object
  analogdb.CreateFilm:
    properties:
      color_type:
        example: color
        type: string
      description:
        example: Kodak Portra 400 is professional color negative film with fine grain
        type: string
      make:
        example: kodak
        type: string
      speed:
        example: 400
        type: integer
      type:
        example: portra 400
        type: string
    type: object
  analogdb.CreatePost:
    properties:
      aperture:
        example: f/2.0
        type: string
      author:
        example: thecameraman
        type: string
      camera_make:
        example: nikon
        type: string
      camera_model:
        example: fm2
        type: string
      caption:
        $ref: '#/definitions/analogdb.PostCaption'
      colors:
        items:
          $ref: '#/definitions/analogdb.Color'
        type: array
      description:
        example: My favorite camera and film combo on 35mm at f/2.0
        type: string
      film_make:
        example: kodak
        type: string
      film_speed:
        example: 400
        type: integer
      film_type:
        example: color
        type: string
      focal_length:
        example: 35
        type: integer
      grayscale:
        example: false
        type: boolean
      images:
        items:
          $ref: '#/definitions/analogdb.Image'
        type: array
      keywords:
        items:
          $ref: '#/definitions/analogdb.Keyword'
        type: array
      nsfw:
        example: false
        type: boolean
      permalink:
        example: https://www.reddit.com/r/analog/comments/1/post
        type: string
      score:
        example: 1000
        type: integer
      sprocket:
        example: false
        type: boolean
      timestamp:
        example: 1752354541
        type: integer
      title:
        example: A day at the fields [Nikon FM2 | Portra 400]
        type: string
    type: object
  analogdb.Error:
    properties:
      code:
        example: not_found
        type: string
      message:
        example: not found
        type: string
    type: object
  analogdb.Film:
    properties:
      color_type:
        example: color
        type: string
      created:
        example: "2025-07-11T12:00:00Z"
        type: string
      description:
        example: Kodak Portra 400 is professional color negative film with fine grain
        type: string
      id:
        example: 1
        type: integer
      make:
        example: kodak
        type: string
      post_count:
        example: 25
        type: integer
      slug:
        example: kodak-portra-400
        type: string
      speed:
        example: 400
        type: integer
      top_posts:
        items:
          $ref: '#/definitions/analogdb.CatalogPost'
        type: array
      type:
        example: portra 400
        type: string
      updated:
        example: "2025-07-11T12:00:00Z"
        type: string
