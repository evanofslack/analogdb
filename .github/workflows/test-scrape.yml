name: test-scrape

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrape/**"
      - ".github/workflows/test-scrape.yml"
  pull_request:
    paths:
      - "scrape/**"
      - ".github/workflows/test-scrape.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scrape

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install openapi-generator
        run: npm install -g @openapitools/openapi-generator-cli
        
      - name: Generate python client
        run: make gen-client-python
        working-directory: .

      - name: Set up Python
        run: uv python install 3.13

      - name: Cache uv dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest src packages --cov=src --cov=packages --cov-report=xml

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
