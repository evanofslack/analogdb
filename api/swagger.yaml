basePath: /v1
definitions:
  analogdb.Camera:
    properties:
      created:
        example: "2025-07-11T12:00:00Z"
        type: string
      description:
        example: Nikon FM2 is a dependable SLR camera
        type: string
      id:
        example: 1
        type: integer
      make:
        example: nikon
        type: string
      model:
        example: fm2
        type: string
      post_count:
        example: 50
        type: integer
      updated:
        example: "2025-07-11T12:00:00Z"
        type: string
    type: object
  analogdb.Color:
    properties:
      css:
        example: dimgray
        type: string
      hex:
        example: '#837d5c'
        type: string
      html:
        example: gray
        type: string
      percent:
        example: 0.55
        type: number
    type: object
  analogdb.CreateCamera:
    properties:
      description:
        example: Nikon FM2 is a dependable SLR camera
        type: string
      make:
        example: nikon
        type: string
      model:
        example: fm2
        type: string
    type: object
  analogdb.CreateFilm:
    properties:
      color_type:
        example: color
        type: string
      description:
        example: Kodak Portra 400 is professional color negative film with fine grain
        type: string
      make:
        example: kodak
        type: string
      speed:
        example: 400
        type: integer
      type:
        example: portra 400
        type: string
    type: object
  analogdb.CreatePost:
    properties:
      aperture:
        example: f/2.0
        type: string
      author:
        example: thecameraman
        type: string
      camera_make:
        example: nikon
        type: string
      camera_model:
        example: fm2
        type: string
      colors:
        items:
          $ref: '#/definitions/analogdb.Color'
        type: array
      description:
        example: My favorite camera and film combo on 35mm at f/2.0
        type: string
      film_make:
        example: kodak
        type: string
      film_speed:
        example: 400
        type: integer
      film_type:
        example: color
        type: string
      focal_length:
        example: 35
        type: integer
      grayscale:
        example: false
        type: boolean
      images:
        items:
          $ref: '#/definitions/analogdb.Image'
        type: array
      keywords:
        items:
          $ref: '#/definitions/analogdb.Keyword'
        type: array
      nsfw:
        example: false
        type: boolean
      permalink:
        example: https://www.reddit.com/r/analog/comments/1/post
        type: string
      score:
        example: 1000
        type: integer
      sprocket:
        example: false
        type: boolean
      title:
        example: A day at the fields [Nikon FM2 | Portra 400]
        type: string
      unix_time:
        example: 1752354541
        type: integer
    type: object
  analogdb.Error:
    properties:
      code:
        example: not_found
        type: string
      message:
        example: not found
        type: string
    type: object
  analogdb.Film:
    properties:
      color_type:
        type: string
      created:
        example: "2025-07-11T12:00:00Z"
        type: string
      description:
        example: Kodak Portra 400 is professional color negative film with fine grain
        type: string
      id:
        example: 1
        type: integer
      make:
        example: kodak
        type: string
      post_count:
        example: 25
        type: integer
      speed:
        example: 400
        type: integer
      type:
        example: portra 400
        type: string
      updated:
        example: "2025-07-11T12:00:00Z"
        type: string
    type: object
  analogdb.Image:
    properties:
      height:
        example: 7600
        type: integer
      resolution:
        example: high
        type: string
      url:
        example: https://cloudfront.net/1.jpeg
        type: string
      width:
        example: 4800
        type: integer
    type: object
  analogdb.Keyword:
    properties:
      weight:
        example: 0.43
        type: number
      word:
        example: baseball
        type: string
    type: object
  analogdb.PatchPost:
    properties:
      aperture:
        example: f/2.4
        type: string
      camera_make:
        example: canon
        type: string
      camera_model:
        example: ae-1
        type: string
      colors:
        items:
          $ref: '#/definitions/analogdb.Color'
        type: array
      description:
        example: New description
        type: string
      film_make:
        example: kodak
        type: string
      film_speed:
        example: 200
        type: integer
      film_type:
        example: gold 200
        type: string
      focal_length:
        example: 50
        type: integer
      grayscale:
        example: false
        type: boolean
      keywords:
        items:
          $ref: '#/definitions/analogdb.Keyword'
        type: array
      nsfw:
        example: true
        type: boolean
      score:
        example: 1010
        type: integer
      sprocket:
        example: true
        type: boolean
    type: object
  analogdb.Post:
    properties:
      aperture:
        example: f/2.0
        type: string
      author:
        example: thecameraman
        type: string
      camera_make:
        example: nikon
        type: string
      camera_model:
        example: fm2
        type: string
      colors:
        items:
          $ref: '#/definitions/analogdb.Color'
        type: array
      description:
        example: My favorite camera and film combo on 35mm at f/2.0
        type: string
      film_make:
        example: kodak
        type: string
      film_speed:
        example: 400
        type: integer
      film_type:
        example: color
        type: string
      focal_length:
        example: 35
        type: integer
      grayscale:
        example: false
        type: boolean
      id:
        example: 1
        type: integer
      images:
        items:
          $ref: '#/definitions/analogdb.Image'
        type: array
      keywords:
        items:
          $ref: '#/definitions/analogdb.Keyword'
        type: array
      nsfw:
        example: false
        type: boolean
      permalink:
        example: https://www.reddit.com/r/analog/comments/1/post
        type: string
      score:
        example: 1000
        type: integer
      sprocket:
        example: false
        type: boolean
      title:
        example: A day at the fields [Nikon FM2 | Portra 400]
        type: string
      unix_time:
        example: 1752354541
        type: integer
    type: object
  server.CamerasResponse:
    properties:
      cameras:
        items:
          $ref: '#/definitions/analogdb.Camera'
        type: array
    type: object
  server.CreateCameraResponse:
    properties:
      camera:
        $ref: '#/definitions/analogdb.CreateCamera'
      message:
        example: Success, camera created
        type: string
    type: object
  server.CreateFilmResponse:
    properties:
      film:
        $ref: '#/definitions/analogdb.CreateFilm'
      message:
        example: Success, film created
        type: string
    type: object
  server.CreatePostResponse:
    properties:
      message:
        example: Success, post created
        type: string
      post:
        $ref: '#/definitions/analogdb.Post'
    type: object
  server.DeleteResponse:
    properties:
      message:
        example: Success, post deleted
        type: string
    type: object
  server.FilmsResponse:
    properties:
      films:
        items:
          $ref: '#/definitions/analogdb.Film'
        type: array
    type: object
  server.IDsResponse:
    properties:
      ids:
        example:
        - 1
        - 2
        - 3
        - 4
        - 5
        items:
          type: integer
        type: array
    type: object
  server.Meta:
    properties:
      next_page_id:
        example: 1752244116
        type: integer
      next_page_url:
        example: /posts?sort=latest&page_size=20&page_id=1752244116
        type: string
      page_size:
        example: 20
        type: integer
      seed:
        example: 37
        type: integer
      total_posts:
        example: 200
        type: integer
    type: object
  server.PatchResponse:
    properties:
      message:
        example: Success, post patched
        type: string
    type: object
  server.PostResponse:
    properties:
      meta:
        $ref: '#/definitions/server.Meta'
      posts:
        items:
          $ref: '#/definitions/analogdb.Post'
        type: array
    type: object
  server.SimilarPostsResponse:
    properties:
      posts:
        items:
          $ref: '#/definitions/analogdb.Post'
        type: array
    type: object
  server.encodePostsRequest:
    properties:
      batch_size:
        example: 20
        type: integer
      ids:
        items:
          type: integer
        type: array
    type: object
  server.encodePostsResponse:
    properties:
      message:
        example: successfully encoded 5 posts
        type: string
    type: object
host: api.analogdb.com
info:
  contact: {}
  description: API for analogdb film database
  title: AnalogDB API
  version: "1.0"
paths:
  /camera:
    post:
      consumes:
      - application/json
      description: Create a new camera entry (requires authentication)
      parameters:
      - description: camera data to create
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateCamera'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateCameraResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new camera
      tags:
      - camera
    put:
      consumes:
      - application/json
      description: Create a new camera entry (requires authentication)
      parameters:
      - description: camera data to create
        in: body
        name: camera
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateCamera'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateCameraResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new camera
      tags:
      - camera
  /cameras:
    get:
      consumes:
      - application/json
      description: Retrieve cameras with optional query parameters for filtering and
        sorting
      parameters:
      - description: Sort order
        enum:
        - alphabetical
        - counts
        in: query
        name: sort
        type: string
      - description: Number of results to return
        in: query
        name: page_size
        type: integer
      - description: Filter by camera make
        in: query
        name: make
        type: string
      - description: Filter by camera model
        in: query
        name: model
        type: string
      - description: Filter by specific camera ID
        in: query
        name: id
        type: integer
      - description: Include count data
        in: query
        name: include_counts
        type: boolean
      - description: Exclude zero counts
        in: query
        name: exclude_zero_counts
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.CamerasResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get cameras with optional filtering
      tags:
      - cameras
  /encode:
    put:
      consumes:
      - application/json
      description: Encode posts to generate embeddings for similarity search. Supports
        both single post and batch encoding (requires authentication)
      parameters:
      - description: Post IDs and batch size for encoding
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.encodePostsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.encodePostsResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Encode posts for similarity matching
      tags:
      - similarity
  /film:
    post:
      consumes:
      - application/json
      description: Create a new film entry (requires authentication)
      parameters:
      - description: Film data to create
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateFilm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateFilmResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new film
      tags:
      - film
    put:
      consumes:
      - application/json
      description: Create a new film entry (requires authentication)
      parameters:
      - description: Film data to create
        in: body
        name: film
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreateFilm'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreateFilmResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new film
      tags:
      - film
  /films:
    get:
      consumes:
      - application/json
      description: Retrieve films with optional query parameters for filtering and
        sorting
      parameters:
      - description: Sort order
        enum:
        - alphabetical
        - counts
        in: query
        name: sort
        type: string
      - description: Number of results to return
        in: query
        name: page_size
        type: integer
      - description: Filter by film make
        in: query
        name: make
        type: string
      - description: Filter by film type
        in: query
        name: type
        type: string
      - description: Filter by film speed
        in: query
        name: speed
        type: integer
      - description: Filter by color type
        in: query
        name: colortype
        type: string
      - description: Filter by specific film ID
        in: query
        name: id
        type: integer
      - description: Include count data
        in: query
        name: include_counts
        type: boolean
      - description: Exclude zero counts
        in: query
        name: exclude_zero_counts
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.FilmsResponse'
        "400":
          description: Invalid query parameters
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get films with optional filtering
      tags:
      - films
  /post:
    post:
      consumes:
      - application/json
      description: Create a new post with image analysis and similarity encoding (requires
        authentication)
      parameters:
      - description: Post data to create
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/analogdb.CreatePost'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/server.CreatePostResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Create a new post
      tags:
      - post
  /post/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a post by ID from database (requires authentication)
      parameters:
      - description: Post ID to delete
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.DeleteResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Delete a post
      tags:
      - post
    get:
      consumes:
      - application/json
      description: Get a post by ID from database
      parameters:
      - description: Post ID to get
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/analogdb.Post'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Get a post
      tags:
      - post
    patch:
      consumes:
      - application/json
      description: Partially update a post's properties by ID (requires authentication)
      parameters:
      - description: Post ID to update
        in: path
        name: id
        required: true
        type: integer
      - description: Post fields to update
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/analogdb.PatchPost'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.PatchResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "422":
          description: Unprocessable entity
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      security:
      - BasicAuth: []
      summary: Update a post
      tags:
      - post
  /posts:
    get:
      consumes:
      - application/json
      description: Retrieve posts with optional query parameters for filtering by
        camera, film, keywords, etc. Supports pagination
      parameters:
      - default: 20
        description: Number of posts per page
        in: query
        name: page_size
        type: integer
      - description: Page offset for pagination
        in: query
        name: page_id
        type: integer
      - default: time
        description: Sort order
        enum:
        - time
        - score
        - random
        in: query
        name: sort
        type: string
      - description: Filter by camera make
        in: query
        name: camera_make
        type: string
      - description: Filter by camera model
        in: query
        name: camera_model
        type: string
      - description: Filter by film make
        in: query
        name: film_make
        type: string
      - description: Filter by film type
        in: query
        name: film_type
        type: string
      - description: Filter by film speed
        in: query
        name: film_speed
        type: integer
      - description: Filter by focal length
        in: query
        name: focal_length
        type: integer
      - description: Filter by aperture
        in: query
        name: aperture
        type: string
      - description: Filter by author
        in: query
        name: author
        type: string
      - description: Include NSFW posts
        in: query
        name: nsfw
        type: boolean
      - description: Filter by grayscale posts
        in: query
        name: grayscale
        type: boolean
      - description: Filter by sprocket posts
        in: query
        name: sprocket
        type: boolean
      - description: Filter by keywords (comma-separated)
        in: query
        name: keywords
        type: string
      - description: Random seed for consistent random sorting
        in: query
        name: seed
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.PostResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get posts with optional filtering and pagination
      tags:
      - posts
  /posts/ids:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all post IDs in the system
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.IDsResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Get all post IDs
      tags:
      - posts
  /posts/similar:
    get:
      consumes:
      - application/json
      description: Find posts similar to a given post using similarity matching
      parameters:
      - description: Post ID to find similar posts for
        in: query
        name: id
        required: true
        type: integer
      - default: 12
        description: Maximum number of similar posts to return
        in: query
        name: page_size
        type: integer
      - description: Include nsfw posts in query
        in: query
        name: nsfw
        type: boolean
      - description: Include b&w posts in query
        in: query
        name: grayscale
        type: boolean
      - description: Include sprocketshot posts in query
        in: query
        name: sprocket
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.SimilarPostsResponse'
        "400":
          description: Invalid request body
          schema:
            $ref: '#/definitions/analogdb.Error'
        "404":
          description: Not found
          schema:
            $ref: '#/definitions/analogdb.Error'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/analogdb.Error'
      summary: Find similar posts
