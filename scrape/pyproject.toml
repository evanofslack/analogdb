[project]
name = "dagster-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.5.0",
    "dagster-webserver>=1.5.0",
    "analogdb",
    "scrape",
    "python-dotenv>=1.1.0",
    "dagster-aws>=0.26.19",
    "pip>=25.1.1",
    "dagster-postgres>=0.26.19",
    "dagster-docker>=0.26.19",
    "dagster-obstore>=0.2.3",
]

[tool.uv.workspace]
members = [
    "packages/analogdb",
    "packages/scrape"
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.4.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.uv.sources]
analogdb = { workspace = true }
scrape = { workspace = true }

[tool.dagster]
module_name = "dagster_app.definitions"

[tool.ruff.lint]
select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
