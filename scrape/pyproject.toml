[project]
name = "dagster-app"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.13.1",
    "dagster-webserver>=1.13.1",
    "analogdb",
    "scrape",
    "python-dotenv>=1.2.2",
    "dagster-aws>=0.29.1",
    "dagster-postgres>=0.29.1",
    "dagster-docker>=0.29.1",
    "dagster-obstore>=0.2.5",
]

[tool.uv.workspace]
members = [
    "packages/analogdb",
    "packages/scrape"
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "black>=26.3.1",
    "ruff>=0.1.0",
    "pytest-httpserver>=1.1.0",
]

[tool.uv.sources]
analogdb = { workspace = true }
scrape = { workspace = true }

[tool.dagster]
module_name = "dagster_app.definitions"

[tool.ruff.lint]
select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
