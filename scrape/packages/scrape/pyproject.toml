[project]
name = "scrape"
version = "0.1.0"
description = "Reddit scraping"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "inflect>=7.5.0",
    "numpy>=2.2.6",
    "openai>=1.84.0",
    "pillow>=12.3.0",
    "praw>=7.8.1",
    "rapidfuzz>=3.14.6",
    "requests>=2.33.0",
    "retry>=0.9.2",
    "scipy>=1.15.3",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
