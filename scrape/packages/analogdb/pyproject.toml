[project]
name = "analogdb"
version = "0.1.0"
description = "analogdb API client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "analogdb-generated",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
analogdb-generated = { path = "../../../api/clients/python" }
