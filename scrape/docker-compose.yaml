services:
  dagster_postgres:
    image: postgres:15
    container_name: dagster_postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dagster_postgres_data:/var/lib/postgresql/data

  dagster_webserver:
    build: .
    container_name: dagster_webserver
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_HOST: dagster_postgres
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB}
      DAGSTER_POSTGRES_PORT: 5432
    volumes:
      - dagster_storage:/app/dagster_storage
      - ./config/dagster.yaml:/app/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${DAGSTER_PORT:-3000}:3000"
    depends_on:
      - dagster_postgres
    command: >
      sh -c "
        uv run dagster instance migrate &&
        uv run dagster-webserver --host 0.0.0.0 --port 3000
      "

  dagster_daemon:
    build: .
    container_name: dagster_daemon
    env_file:
      - .env
    environment:
      DAGSTER_HOME: /app
      DAGSTER_POSTGRES_USER: ${POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_HOST: dagster_postgres
      DAGSTER_POSTGRES_DB: ${POSTGRES_DB}
      DAGSTER_POSTGRES_PORT: 5432
    volumes:
      - dagster_storage:/app/dagster_storage
      - ./config/dagster.yaml:/app/dagster.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - dagster_postgres
      - dagster_webserver
    command: uv run dagster-daemon run

volumes:
  dagster_postgres_data:
  dagster_storage:
