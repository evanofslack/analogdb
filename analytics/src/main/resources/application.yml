spring:
  application:
    name: analytics-service
  kafka:
    consumer:
      bootstrap-servers: ${KAFKA_BROKERS}
      group-id: ${KAFKA_CONSUMER_GROUP:analytics-consumer}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"

clickhouse:
  url: ${CLICKHOUSE_URL}
  database: ${CLICKHOUSE_DB:default}
  table: ${CLICKHOUSE_TABLE:events}
  username: ${CLICKHOUSE_USER:default}
  password: ${CLICKHOUSE_PASSWORD:}
  batchSize: ${CLICKHOUSE_BATCH_SIZE:1000}
  flushIntervalMs: ${CLICKHOUSE_FLUSH_INTERVAL_MS:10000}

kafka:
  topic: ${KAFKA_TOPIC:analytics-events}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.evanofslack.analogdb: ${APP_LOG_LEVEL:INFO}

